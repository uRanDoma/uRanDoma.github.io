<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Індивідуальні завдання</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
  section { background-color: #fff; border: 2px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
  h2 { color: #2a7ae2; }
  table { margin: 0 auto; border-collapse: collapse; }
  td, th { border: 1px solid #000; padding: 5px 10px; text-align: center; }
</style>
</head>
<body>

<!-- Секція 1 -->
<section>
  <h2>Завдання 1: Привітання</h2>
  <button onclick="greet()">Показати привітання</button>
  <div id="greetResult"></div>
</section>

<!-- Секція 2 -->
<section>
  <h2>Завдання 2: Вибір кнопки</h2>
  <button onclick="buttonChoice()">Натисніть для вибору</button>
  <div id="choiceResult"></div>
</section>

<!-- Секція 3 -->
<section>
  <h2>Завдання 3: Таблиця множення</h2>
  <button onclick="multiplicationTable()">Показати таблицю</button>
  <div id="tableResult"></div>
</section>

<script src="script.js"></script>
</body>
</html>
