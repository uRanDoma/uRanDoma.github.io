<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Індивідуальні завдання 2</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
  section { background-color: #fff; border: 2px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
  h2 { color: #2a7ae2; }
  button { padding: 8px 15px; margin-top: 10px; cursor: pointer; border-radius: 5px; border: none; background-color: #2a7ae2; color: #fff; }
  button:hover { background-color: #1d5bbf; }
</style>
</head>
<body>

<!-- Секція 1 -->
<section>
  <h2>Завдання 1: Привітання</h2>
  <button onclick="greetUser()">Ввести ім'я</button>
  <div id="greetResult"></div>
</section>

<!-- Секція 2 -->
<section>
  <h2>Завдання 2: Рік народження</h2>
  <button onclick="calculateBirthYear()">Ввести вік</button>
  <div id="birthYearResult"></div>
</section>

<!-- Секція 3 -->
<section>
  <h2>Завдання 3: Повне ім'я</h2>
  <button onclick="fullName()">Ввести ім'я та прізвище</button>
  <div id="fullNameResult"></div>
</section>

<script src="script.js"></script>
</body>
</html>
